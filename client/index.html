    <!-- FAQPage JSON-LD — mirrors FAQS array in Faq.jsx -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What's your core specialty — and what do you take on outside of it?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Automation and bots are what I do most and know best: document processing, system integrations, ticket routing, data pipelines. When a problem calls for something adjacent — an ML model, a full-stack web app, a mobile product — I build that too, using the same process: scope against a specific outcome, build iteratively, hand over working code. I don't take on work I'd have to learn on your budget."
            }
          },
          {
            "@type": "Question",
            "name": "How do you scope a project before we commit budget?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "We start with a short paid discovery sprint: map the current manual process, identify where automation breaks down or needs a human decision, and set a specific success metric (hours saved, error rate, throughput). Then I quote the build against that, not a general estimate."
            }
          },
          {
            "@type": "Question",
            "name": "Who owns the code when the project ends?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "You do, fully. Source code, model weights, pipeline configs, and documentation are handed over at every milestone — not held until final payment. You can run it, modify it, or hand it to an internal team without restriction."
            }
          },
          {
            "@type": "Question",
            "name": "What if requirements change halfway through?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Expected on most builds. We work in weekly increments, so scope changes get a quick re-price and slot into the next week's work without derailing the timeline or requiring a contract amendment for every tweak."
            }
          },
          {
            "@type": "Question",
            "name": "Do you work with our existing engineering team or take the whole thing?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Both. I regularly drop into an existing Python or MERN codebase, match the conventions already in place, and hand back a PR — I don't rewrite what's already working just to put my fingerprints on it. I also take greenfield builds from zero to deployed."
            }
          }
        ]
      }
    </script>
